<!doctype html>
<meta charset="utf-8">
<style>
  body { width: 300px; margin: 0; padding: 14px; font: 13px/1.45 system-ui, sans-serif; color: #1f2328; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  .row { display: flex; justify-content: space-between; margin: 4px 0; } .row b { font-variant-numeric: tabular-nums; }
  .warn { color: #b3403a; font-size: 12px; }
  button { width: 100%; margin-top: 6px; padding: 6px; border-radius: 6px; border: 1px solid #d9d9d3; background: #f1f1ec; font: inherit; cursor: pointer; }
  button.primary { background: #4f5bd5; color: #fff; border-color: #4f5bd5; }
  pre { max-height: 160px; overflow: auto; background: #f3f4fb; padding: 6px; font-size: 11px; white-space: pre-wrap; }
  textarea { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 6px; border: 1px solid #d9d9d3; border-radius: 6px; font: inherit; resize: vertical; }
  .note { color: #647084; font-size: 12px; margin-top: 4px; }
</style>
<h1>Advice Tracker</h1>
<div id="status"></div>
<div class="row"><span>Advice conversations found</span><b id="n-found">0</b></div>
<div class="row"><span>Waiting for your answers</span><b id="n-pending">0</b></div>
<div class="row"><span>Follow-up questions</span><b id="n-due">0</b></div>
<div class="row"><span>Not advice</span><b id="n-removed">0</b></div>
<div class="row"><span>Past conversations to annotate</span><b id="n-past">0</b></div>
<div id="history-note"></div>
<button class="primary" id="open-checkin">Quick check-ins</button>
<button class="primary" id="open-outcomes">Outcomes (follow-ups, past conversations)</button>
<button id="pause">Pause tracking</button>
<button id="debug">Show captured messages on this tab</button>
<button id="feedback">Send feedback on the study</button>
<div id="feedback-box" hidden>
  <textarea id="feedback-text" rows="5" maxlength="5000" placeholder="Anything you want the study team to know: what worked, what did not, a question..."></textarea>
  <div class="note">Sent to the study team with your participant ID. Names on your settings list, e-mail addresses, phone
    numbers and similar details are removed first.</div>
  <button class="primary" id="feedback-send">Send</button>
  <div class="note" id="feedback-status"></div>
</div>
<button id="options">Settings</button>
<pre id="debug-out" hidden></pre>
<script src="../config.js"></script>
<script src="../lib/sites.js"></script>
<script src="../lib/modes.js"></script>
<script src="popup.js"></script>
